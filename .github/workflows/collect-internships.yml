name: collect-internships

# Path A of the pipeline: poll every roster firm's keyless ATS/Workday feed and
# commit todays_candidates.json for the internship-watch judge routine to read.
#
# WHY GITHUB ACTIONS (not the Claude cloud routine): the collector makes DIRECT
# HTTP calls to greenhouse/*.myworkdayjobs.com/etc. The Claude cloud sandbox
# blocks that egress ("egress policy denied all ATS/Workday hosts" — see bin/run.sh),
# which forced the collector onto a local Mac cron. Actions runners have open
# egress, run for free, and need no laptop. Zero LLM tokens — pure Python.
# NOTE: enabling this replaces the Mac launchd job — disable that plist to avoid
# double-collection (both push the same artifacts to main).

# RETIRED 2026-08-08 (Janus): this pipeline is an archive — see README. The
# workflow is `disabled_manually` on GitHub AND its `schedule:` block has been
# removed, so flipping the workflow back to active does not restart collection.
# Both have to be undone deliberately. The judge routine it fed
# (`internship-watch`) is disabled too; collecting without it delivers nothing.
#
# Former schedule, if this is ever revived: `- cron: "0 10 * * *"` (~06:00 ET).
# Restore it as ONE run per judge cycle — cloud_collect.py overwrites
# todays_candidates.json with only that run's not-yet-seen postings and advances
# seen_postings.json, so a second run before the judge reads the artifact would
# blank the first run's postings.

on:
  workflow_dispatch: {}     # manual "Run workflow" button only

permissions:
  contents: write           # push the refreshed artifacts back to main

concurrency:
  group: collect-internships
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-collect.txt

      - name: Poll ATS + Workday feeds → todays_candidates.json
        run: python cloud_collect.py

      - name: Commit & push artifacts
        run: |
          git config user.name "internship-collector[bot]"
          git config user.email "internship-collector@users.noreply.github.com"
          # A whole-file diff is never empty: todays_candidates.json embeds a fresh
          # generated_at and seen_postings.json a fresh updated on every run. Only a
          # change to the .candidates array is a real change worth a commit — compare
          # that array against what's committed and revert timestamp-only churn.
          changed=$(python <<'PY'
          import json, subprocess
          def candidates(text):
              return json.loads(text).get("candidates")
          new = candidates(open("todays_candidates.json", encoding="utf-8").read())
          try:
              old = candidates(subprocess.run(
                  ["git", "show", "HEAD:todays_candidates.json"],
                  capture_output=True, text=True, check=True).stdout)
          except subprocess.CalledProcessError:
              old = None
          print("yes" if new != old else "no")
          PY
          )
          if [ "$changed" != "yes" ]; then
            echo "no candidate changes — reverting timestamp-only churn"
            git checkout -- todays_candidates.json seen_postings.json
            exit 0
          fi
          git add todays_candidates.json seen_postings.json
          git commit -m "collector: refresh candidates $(date -u +%FT%TZ) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed — retry in 10s"; sleep 10
          done
          echo "::error::push never succeeded"; exit 1
